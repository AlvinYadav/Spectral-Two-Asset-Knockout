# ============================================================
#  HOLDOUT — sealed at Level 2F. Not to be used in any tuning,
#  threshold selection, or debugging loop. Single evaluation at
#  the end of LEVEL_2V; results published regardless of outcome.
# ============================================================
#
#  Euclidean-circle (Mathieu) holdout. Copy of default.toml with the
#  [financial]/[barrier] regime changed to a point that post-dates all
#  tuning; volatility ordering swapped (sigma1 > sigma2) flips the ellipse
#  orientation. [numerical]/[monte_carlo]/[fdm] blocks are UNCHANGED from
#  default.toml (holdouts test the method at frozen tuning, never retuned).

[financial]
S1_0   = 100.0
S2_0   = 100.0
sigma1 = 0.25     # > sigma2 (swapped ordering flips ellipse orientation)
sigma2 = 0.18
rho    = 0.35
r      = 0.03
T      = 0.75
K      = 165.0
w1     = 0.7
w2     = 1.3

[barrier]
R = 0.55          # Knockout radius in log-return space: x₁² + x₂² > R²

[numerical]
N_trunc        = 50    # UNCHANGED from default.toml (frozen tuning)
N_angular_max  = 6
M_radial_max   = 4
q_max          = 100.0
q_scan_points  = 1500
N_mu_quad      = 40
N_nu_quad      = 96

[monte_carlo]
enabled  = true
n_paths  = 2_000_000
n_steps  = 500
seed     = 20260711

[fdm]
enabled  = true
N_mu     = 320
N_nu     = 320
N_time   = 500
