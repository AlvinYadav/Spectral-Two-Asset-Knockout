# Tight barrier — significant knockout probability
# Good test case: spectral price should be noticeably below vanilla

[financial]
S1_0 = 100.0
S2_0 = 100.0
sigma1 = 0.20
sigma2 = 0.30
rho = 0.50
r = 0.05
T = 1.0
K = 180.0
w1 = 1.0
w2 = 1.0

[barrier]
R = 0.3    # Very tight — many paths knock out

[numerical]
mathieu_backend   = "tridiagonal"
projection_method = "galerkin"
smooth_tau_frac   = 0.0
# ── Truncation ──
# Keep every mode with lambda^2 < Lambda = lambda_1^2 + (2/tau_min) ln(1/eps),
# tau_min = tau_min_frac * T. The scan runs to q = c^2 Lambda / 4; the index
# limits below (N_angular_max, M_radial_max, q_max, q_scan_points) apply only
# with truncation = "index", the earlier rule.
truncation   = "eigenvalue"
tau_min_frac = 0.25
eps_trunc    = 1e-6
N_trunc = 50
N_angular_max = 8
M_radial_max = 5
q_max = 350.0
q_scan_points = 5250
N_mu_quad = 50
N_nu_quad = 96

[monte_carlo]
enabled = false
n_paths = 500_000
n_steps = 500
seed = 42

[fdm]
enabled = true
N_mu = 320
N_nu = 320
N_time = 500
