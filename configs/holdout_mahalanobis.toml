# ============================================================
#  HOLDOUT — sealed at Level 2F. Not to be used in any tuning,
#  threshold selection, or debugging loop. Single evaluation at
#  the end of LEVEL_2V; results published regardless of outcome.
# ============================================================
#
#  Mahalanobis-ellipse (Fourier-Bessel) holdout. Copy of mahalanobis.toml
#  with the [financial]/[mahalanobis] regime changed to a point that
#  post-dates all tuning. [numerical]/[monte_carlo]/[fdm] blocks are
#  UNCHANGED from mahalanobis.toml (holdouts test the method at frozen
#  tuning, never retuned).

[financial]
S1_0   = 100.0
S2_0   = 100.0
sigma1 = 0.28
sigma2 = 0.16
rho    = -0.30
r      = 0.04
T      = 1.25
K      = 170.0
w1     = 1.0
w2     = 1.0

[mahalanobis]
R = 1.3             # Mahalanobis radius

[numerical]
N_angular_max = 8   # UNCHANGED from mahalanobis.toml (frozen tuning)
M_radial_max  = 6
N_r_quad      = 40
N_theta_quad  = 96

[monte_carlo]
enabled = true
n_paths = 500_000
n_steps = 500
seed    = 20260711

[fdm]
enabled = true
N       = 200
N_time  = 500
